<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260"><title>Two snapshots, not continuous price monitoring</title><rect width="900" height="260" rx="20" fill="#0e1d38"/><g fill="white" font-family="sans-serif"><text x="35" y="60" font-size="28">Same recorded prices; newer observation</text><text x="35" y="120" font-size="24">Oct 5 snapshot → 151167 seconds → Oct 7 snapshot</text><text x="35" y="180" font-size="24">Four matched plans: recorded differences = USD 0</text><text x="35" y="225" font-size="19">No claim about changes between the two snapshots.</text></g></svg>
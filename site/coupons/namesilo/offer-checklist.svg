<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img"><title>Read each offer as a separate record</title><rect width="1000" height="620" rx="24" fill="#102b3f"/><text x="48" y="65" fill="white" font-family="Arial" font-size="30">Read each offer as a separate record</text><rect x="40" y="108" width="920" height="92" rx="14" fill="#20465c"/><text x="62" y="143" fill="#9de4ef" font-family="Arial" font-size="24">Transaction</text><text x="62" y="176" fill="white" font-family="Arial" font-size="22">Registration and transfer are different line items.</text><rect x="40" y="218" width="920" height="92" rx="14" fill="#20465c"/><text x="62" y="253" fill="#9de4ef" font-family="Arial" font-size="24">Eligibility</text><text x="62" y="286" fill="white" font-family="Arial" font-size="22">Keep membership or programme conditions beside the amount.</text><rect x="40" y="328" width="920" height="92" rx="14" fill="#20465c"/><text x="62" y="363" fill="#9de4ef" font-family="Arial" font-size="24">Expiry</text><text x="62" y="396" fill="white" font-family="Arial" font-size="22">Check each offer card; do not copy a neighbouring date.</text><rect x="40" y="438" width="920" height="92" rx="14" fill="#20465c"/><text x="62" y="473" fill="#9de4ef" font-family="Arial" font-size="24">Code status</text><text x="62" y="506" fill="white" font-family="Arial" font-size="22">A promotion link does not establish a reusable public code.</text><text x="48" y="590" fill="#c6d9e3" font-family="Arial" font-size="18">Original checklist based on the existing NameSilo review dated 2026-10-19.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="850" viewBox="0 0 680 850"><title>The order must be higher than the voucher</title><rect width="680" height="850" rx="24" fill="#102b3f"/><text x="30" y="48" font-family="Arial" font-size="30" fill="white">The order must be higher than</text><text x="30" y="88" font-family="Arial" font-size="30" fill="white">the voucher</text><rect x="22" y="145" width="636" height="132" rx="14" fill="#20465c"/><text x="40" y="179" font-family="Arial" font-size="25" fill="#e3f4f8">Synthetic input: Voucher value: EUR 5.</text><rect x="22" y="291" width="636" height="132" rx="14" fill="#20465c"/><text x="40" y="325" font-family="Arial" font-size="25" fill="#e3f4f8">Equal amount: EUR 5 is not higher than</text><text x="40" y="354" font-family="Arial" font-size="25" fill="#e3f4f8">EUR 5.</text><rect x="22" y="437" width="636" height="132" rx="14" fill="#20465c"/><text x="40" y="471" font-family="Arial" font-size="25" fill="#e3f4f8">Greater amount: EUR 6 clears only the</text><text x="40" y="500" font-family="Arial" font-size="25" fill="#e3f4f8">amount check.</text><rect x="22" y="583" width="636" height="132" rx="14" fill="#20465c"/><text x="40" y="617" font-family="Arial" font-size="25" fill="#e3f4f8">Other checks: Product and order</text><text x="40" y="646" font-family="Arial" font-size="25" fill="#e3f4f8">restrictions still apply.</text><text x="30" y="810" font-family="Arial" font-size="18" fill="white">Original document audit | Reviewed 2026-10-23</text></svg>
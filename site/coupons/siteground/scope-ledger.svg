<svg xmlns="http://www.w3.org/2000/svg" width="680" height="850" viewBox="0 0 680 850"><title>Separate an offer from the evidence of use</title><rect width="680" height="850" rx="24" fill="#102b3f"/><text x="30" y="48" font-family="Arial" font-size="30" fill="white">Separate an offer from the</text><text x="30" y="88" font-family="Arial" font-size="30" fill="white">evidence of use</text><rect x="22" y="145" width="636" height="132" rx="14" fill="#20465c"/><text x="40" y="179" font-family="Arial" font-size="25" fill="#e3f4f8">Benefit: Read the official product and</text><text x="40" y="208" font-family="Arial" font-size="25" fill="#e3f4f8">conditions together.</text><rect x="22" y="291" width="636" height="132" rx="14" fill="#20465c"/><text x="40" y="325" font-family="Arial" font-size="25" fill="#e3f4f8">Admission: Check the permitted customer</text><text x="40" y="354" font-family="Arial" font-size="25" fill="#e3f4f8">and purchase route.</text><rect x="22" y="437" width="636" height="132" rx="14" fill="#20465c"/><text x="40" y="471" font-family="Arial" font-size="25" fill="#e3f4f8">Observation: A review date does not</text><text x="40" y="500" font-family="Arial" font-size="25" fill="#e3f4f8">establish expiry.</text><rect x="22" y="583" width="636" height="132" rx="14" fill="#20465c"/><text x="40" y="617" font-family="Arial" font-size="25" fill="#e3f4f8">Boundary: A document audit is not a</text><text x="40" y="646" font-family="Arial" font-size="25" fill="#e3f4f8">completed purchase.</text><text x="30" y="810" font-family="Arial" font-size="18" fill="white">Original document audit | Reviewed 2026-10-27</text></svg>
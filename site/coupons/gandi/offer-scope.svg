<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img"><title>Keep the offer and the code separate</title><rect width="1000" height="620" rx="24" fill="#102b3f"/><text x="48" y="65" fill="white" font-family="Arial" font-size="30">Keep the offer and the code separate</text><rect x="40" y="108" width="920" height="92" rx="14" fill="#20465c"/><text x="62" y="143" fill="#9de4ef" font-family="Arial" font-size="24">Public code</text><text x="62" y="176" fill="white" font-family="Arial" font-size="22">No reusable public code verified in this review.</text><rect x="40" y="218" width="920" height="92" rx="14" fill="#20465c"/><text x="62" y="253" fill="#9de4ef" font-family="Arial" font-size="24">Existing sale or premium domain</text><text x="62" y="286" fill="white" font-family="Arial" font-size="22">Documented exclusions still apply.</text><rect x="40" y="328" width="920" height="92" rx="14" fill="#20465c"/><text x="62" y="363" fill="#9de4ef" font-family="Arial" font-size="24">Product scope</text><text x="62" y="396" fill="white" font-family="Arial" font-size="22">A hosting code is not evidence for a domain discount.</text><rect x="40" y="438" width="920" height="92" rx="14" fill="#20465c"/><text x="62" y="473" fill="#9de4ef" font-family="Arial" font-size="24">Before ordering</text><text x="62" y="506" fill="white" font-family="Arial" font-size="22">Read the official item and code conditions together.</text><text x="48" y="590" fill="#c6d9e3" font-family="Arial" font-size="18">Gandi official documents reviewed 2026-10-20 | Document audit, not checkout testing.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="850" viewBox="0 0 680 850"><title>Keep the review fields distinct</title><rect width="680" height="850" rx="24" fill="#102b3f"/><text x="30" y="50" font-family="Arial" font-size="30" fill="white">Keep the review fields distinct</text><rect x="22" y="140" width="636" height="135" rx="14" fill="#20465c"/><text x="40" y="176" font-family="Arial" font-size="27" fill="#e3f4f8">Benefit — Read the exact offer shown in</text><text x="40" y="208" font-family="Arial" font-size="27" fill="#e3f4f8">this article.</text><rect x="22" y="290" width="636" height="135" rx="14" fill="#20465c"/><text x="40" y="326" font-family="Arial" font-size="27" fill="#e3f4f8">Scope — Keep the product and conditions</text><text x="40" y="358" font-family="Arial" font-size="27" fill="#e3f4f8">together.</text><rect x="22" y="440" width="636" height="135" rx="14" fill="#20465c"/><text x="40" y="476" font-family="Arial" font-size="27" fill="#e3f4f8">Source — Use the official link beside</text><text x="40" y="508" font-family="Arial" font-size="27" fill="#e3f4f8">the row.</text><rect x="22" y="590" width="636" height="135" rx="14" fill="#20465c"/><text x="40" y="626" font-family="Arial" font-size="27" fill="#e3f4f8">Date — Review date and expiry are</text><text x="40" y="658" font-family="Arial" font-size="27" fill="#e3f4f8">different fields.</text><text x="30" y="785" font-family="Arial" font-size="19" fill="#c6d9e3">Illustration of the existing review structure; no new offer</text><text x="30" y="809" font-family="Arial" font-size="19" fill="#c6d9e3">claim.</text></svg>
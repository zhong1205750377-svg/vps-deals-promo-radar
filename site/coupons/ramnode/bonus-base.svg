<svg xmlns="http://www.w3.org/2000/svg" width="680" height="850" viewBox="0 0 680 850"><title>The bonus uses the credit added as its base</title><rect width="680" height="850" rx="24" fill="#102b3f"/><text x="30" y="48" font-family="Arial" font-size="30" fill="white">The bonus uses the credit added</text><text x="30" y="88" font-family="Arial" font-size="30" fill="white">as its base</text><rect x="22" y="145" width="636" height="132" rx="14" fill="#20465c"/><text x="40" y="179" font-family="Arial" font-size="25" fill="#e3f4f8">Official offer: CLOUD25 matches eligible</text><text x="40" y="208" font-family="Arial" font-size="25" fill="#e3f4f8">added Cloud Credit by 25%.</text><rect x="22" y="291" width="636" height="132" rx="14" fill="#20465c"/><text x="40" y="325" font-family="Arial" font-size="25" fill="#e3f4f8">Admission: At least $5, one use per</text><text x="40" y="354" font-family="Arial" font-size="25" fill="#e3f4f8">customer.</text><rect x="22" y="437" width="636" height="132" rx="14" fill="#20465c"/><text x="40" y="471" font-family="Arial" font-size="25" fill="#e3f4f8">Exclusions: Moving general account</text><text x="40" y="500" font-family="Arial" font-size="25" fill="#e3f4f8">credit is excluded.</text><rect x="22" y="583" width="636" height="132" rx="14" fill="#20465c"/><text x="40" y="617" font-family="Arial" font-size="25" fill="#e3f4f8">Boundary: No deposit, ticket or</text><text x="40" y="646" font-family="Arial" font-size="25" fill="#e3f4f8">redemption was tested.</text><text x="30" y="810" font-family="Arial" font-size="18" fill="white">Original document audit | Reviewed 2026-10-27</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="850" viewBox="0 0 680 850"><title>Plan a bounded trial experiment</title><rect width="680" height="850" rx="24" fill="#102b3f"/><text x="30" y="48" font-family="Arial" font-size="30" fill="white">Plan a bounded trial experiment</text><rect x="22" y="145" width="636" height="132" rx="14" fill="#20465c"/><text x="40" y="179" font-family="Arial" font-size="25" fill="#e3f4f8">Published duration: 7 days; no payment</text><text x="40" y="208" font-family="Arial" font-size="25" fill="#e3f4f8">or credit card information required.</text><rect x="22" y="291" width="636" height="132" rx="14" fill="#20465c"/><text x="40" y="325" font-family="Arial" font-size="25" fill="#e3f4f8">Published element ceiling: Trial: up to</text><text x="40" y="354" font-family="Arial" font-size="25" fill="#e3f4f8">150 elements.</text><rect x="22" y="437" width="636" height="132" rx="14" fill="#20465c"/><text x="40" y="471" font-family="Arial" font-size="25" fill="#e3f4f8">Synthetic cases: 149: below; 150: at;</text><text x="40" y="500" font-family="Arial" font-size="25" fill="#e3f4f8">151: above the ceiling.</text><rect x="22" y="583" width="636" height="132" rx="14" fill="#20465c"/><text x="40" y="617" font-family="Arial" font-size="25" fill="#e3f4f8">Boundary: Document worksheet; no trial</text><text x="40" y="646" font-family="Arial" font-size="25" fill="#e3f4f8">or site activated.</text><text x="30" y="810" font-family="Arial" font-size="18" fill="white">Original document audit | Reviewed 2026-10-30</text></svg>
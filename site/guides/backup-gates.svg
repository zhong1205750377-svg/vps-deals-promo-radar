<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img"><title>Backup comparison gates</title><rect width="960" height="300" rx="20" fill="#0e1d38"/><g fill="white" font-family="sans-serif"><text x="40" y="60" font-size="30">Match requirements before comparing VPS prices</text><text x="40" y="125" font-size="25">1. Retention → 2. Capture frequency → 3. Storage scope</text><text x="40" y="195" font-size="25">All documented? Compare server + backup cost.</text><text x="40" y="250" font-size="20">Unknown evidence stays unknown. Restore not tested.</text></g></svg>
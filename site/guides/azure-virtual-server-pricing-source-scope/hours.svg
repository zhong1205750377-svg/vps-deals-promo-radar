<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300"><title>Keep the price evidence channel visible</title><rect width="900" height="300" rx="18" fill="#0e1d38"/><g font-family="Arial,sans-serif" fill="white"><text x="30" y="55" font-size="27">Keep the price evidence channel visible</text><text x="30" y="115" font-size="23">Public USD retail: not a negotiated account rate.</text><text x="30" y="170" font-size="23">Non-USD catalog values: reference estimates.</text><text x="30" y="225" font-size="23">Account-linked calculator: still an estimate.</text></g></svg>
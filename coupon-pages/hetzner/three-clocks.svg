<svg xmlns="http://www.w3.org/2000/svg" width="680" height="850" viewBox="0 0 680 850"><title>Keep three timing fields separate</title><rect width="680" height="850" rx="24" fill="#102b3f"/><text x="30" y="48" font-family="Arial" font-size="30" fill="white">Keep three timing fields</text><text x="30" y="88" font-family="Arial" font-size="30" fill="white">separate</text><rect x="22" y="145" width="636" height="132" rx="14" fill="#20465c"/><text x="40" y="179" font-family="Arial" font-size="25" fill="#e3f4f8">Account age: Redeem within first 14 days</text><text x="40" y="208" font-family="Arial" font-size="25" fill="#e3f4f8">of creation.</text><rect x="22" y="291" width="636" height="132" rx="14" fill="#20465c"/><text x="40" y="325" font-family="Arial" font-size="25" fill="#e3f4f8">Credit window: Landing page: current</text><text x="40" y="354" font-family="Arial" font-size="25" fill="#e3f4f8">billing month end.</text><rect x="22" y="437" width="636" height="132" rx="14" fill="#20465c"/><text x="40" y="471" font-family="Arial" font-size="25" fill="#e3f4f8">Billing application: Docs: current</text><text x="40" y="500" font-family="Arial" font-size="25" fill="#e3f4f8">period, not a prior period.</text><rect x="22" y="583" width="636" height="132" rx="14" fill="#20465c"/><text x="40" y="617" font-family="Arial" font-size="25" fill="#e3f4f8">Observation: Review date is not an</text><text x="40" y="646" font-family="Arial" font-size="25" fill="#e3f4f8">expiry guarantee.</text><text x="30" y="810" font-family="Arial" font-size="18" fill="white">Original document audit | Reviewed 2026-10-24</text></svg>
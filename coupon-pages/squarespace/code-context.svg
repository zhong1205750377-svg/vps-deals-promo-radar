<svg xmlns="http://www.w3.org/2000/svg" width="680" height="850" viewBox="0 0 680 850"><title>A code field needs the right context</title><rect width="680" height="850" rx="24" fill="#102b3f"/><text x="30" y="48" font-family="Arial" font-size="30" fill="white">A code field needs the right</text><text x="30" y="88" font-family="Arial" font-size="30" fill="white">context</text><rect x="22" y="145" width="636" height="132" rx="14" fill="#20465c"/><text x="40" y="179" font-family="Arial" font-size="25" fill="#e3f4f8">Platform offer: GIMME10: annual website</text><text x="40" y="208" font-family="Arial" font-size="25" fill="#e3f4f8">plan, first purchase.</text><rect x="22" y="291" width="636" height="132" rx="14" fill="#20465c"/><text x="40" y="325" font-family="Arial" font-size="25" fill="#e3f4f8">Other product routes: A redemption field</text><text x="40" y="354" font-family="Arial" font-size="25" fill="#e3f4f8">does not expand code scope.</text><rect x="22" y="437" width="636" height="132" rx="14" fill="#20465c"/><text x="40" y="471" font-family="Arial" font-size="25" fill="#e3f4f8">Missing field: An automatic discount may</text><text x="40" y="500" font-family="Arial" font-size="25" fill="#e3f4f8">hide the field.</text><rect x="22" y="583" width="636" height="132" rx="14" fill="#20465c"/><text x="40" y="617" font-family="Arial" font-size="25" fill="#e3f4f8">Review: Official sources checked</text><text x="40" y="646" font-family="Arial" font-size="25" fill="#e3f4f8">2026-10-25.</text><text x="30" y="810" font-family="Arial" font-size="18" fill="white">Original document audit | Reviewed 2026-10-25</text></svg>
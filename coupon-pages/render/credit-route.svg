<svg xmlns="http://www.w3.org/2000/svg" width="680" height="850" viewBox="0 0 680 850"><title>An application is not an issued credit</title><rect width="680" height="850" rx="24" fill="#102b3f"/><text x="30" y="48" font-family="Arial" font-size="30" fill="white">An application is not an issued</text><text x="30" y="88" font-family="Arial" font-size="30" fill="white">credit</text><rect x="22" y="145" width="636" height="132" rx="14" fill="#20465c"/><text x="40" y="179" font-family="Arial" font-size="25" fill="#e3f4f8">Enterprise migration: Production</text><text x="40" y="208" font-family="Arial" font-size="25" fill="#e3f4f8">workload, business use, architecture</text><text x="40" y="237" font-family="Arial" font-size="25" fill="#e3f4f8">review.</text><rect x="22" y="291" width="636" height="132" rx="14" fill="#20465c"/><text x="40" y="325" font-family="Arial" font-size="25" fill="#e3f4f8">Issuance: After completed migration and</text><text x="40" y="354" font-family="Arial" font-size="25" fill="#e3f4f8">team review.</text><rect x="22" y="437" width="636" height="132" rx="14" fill="#20465c"/><text x="40" y="471" font-family="Arial" font-size="25" fill="#e3f4f8">Startup route: Different eligibility and</text><text x="40" y="500" font-family="Arial" font-size="25" fill="#e3f4f8">an approval-based credit window.</text><rect x="22" y="583" width="636" height="132" rx="14" fill="#20465c"/><text x="40" y="617" font-family="Arial" font-size="25" fill="#e3f4f8">Boundary: No account application or</text><text x="40" y="646" font-family="Arial" font-size="25" fill="#e3f4f8">purchase was tested.</text><text x="30" y="810" font-family="Arial" font-size="18" fill="white">Original document audit | Reviewed 2026-10-26</text></svg>
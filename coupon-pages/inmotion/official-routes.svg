<svg xmlns="http://www.w3.org/2000/svg" width="680" height="850" viewBox="0 0 680 850"><title>An offer label and a link are separate</title><rect width="680" height="850" rx="24" fill="#102b3f"/><text x="30" y="50" font-family="Arial" font-size="30" fill="white">An offer label and a link are</text><text x="30" y="90" font-family="Arial" font-size="30" fill="white">separate</text><rect x="22" y="140" width="636" height="135" rx="14" fill="#20465c"/><text x="40" y="176" font-family="Arial" font-size="27" fill="#e3f4f8">Observed card — The coupon card calls</text><text x="40" y="208" font-family="Arial" font-size="27" fill="#e3f4f8">its VPS offer managed.</text><rect x="22" y="290" width="636" height="135" rx="14" fill="#20465c"/><text x="40" y="326" font-family="Arial" font-size="27" fill="#e3f4f8">Observed destination — That card links</text><text x="40" y="358" font-family="Arial" font-size="27" fill="#e3f4f8">to /vps-hosting.</text><rect x="22" y="440" width="636" height="135" rx="14" fill="#20465c"/><text x="40" y="476" font-family="Arial" font-size="27" fill="#e3f4f8">Footer label — The same path is</text><text x="40" y="508" font-family="Arial" font-size="27" fill="#e3f4f8">labelled Self-Managed VPS.</text><rect x="22" y="590" width="636" height="135" rx="14" fill="#20465c"/><text x="40" y="626" font-family="Arial" font-size="27" fill="#e3f4f8">Evidence boundary — Confirm management</text><text x="40" y="658" font-family="Arial" font-size="27" fill="#e3f4f8">scope; do not assume it.</text><text x="30" y="785" font-family="Arial" font-size="19" fill="#c6d9e3">Original source-route audit. Official coupon page reviewed</text><text x="30" y="809" font-family="Arial" font-size="19" fill="#c6d9e3">2026-10-22.</text></svg>
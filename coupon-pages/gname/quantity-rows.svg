<svg xmlns="http://www.w3.org/2000/svg" width="680" height="850" viewBox="0 0 680 850"><title>Read the quantity row before the unit price</title><rect width="680" height="850" rx="24" fill="#102b3f"/><text x="30" y="48" font-family="Arial" font-size="30" fill="white">Read the quantity row before</text><text x="30" y="88" font-family="Arial" font-size="30" fill="white">the unit price</text><rect x="22" y="145" width="636" height="132" rx="14" fill="#20465c"/><text x="40" y="179" font-family="Arial" font-size="25" fill="#e3f4f8">Catalogue: The overview headline is not</text><text x="40" y="208" font-family="Arial" font-size="25" fill="#e3f4f8">a quantity-tier quote.</text><rect x="22" y="291" width="636" height="132" rx="14" fill="#20465c"/><text x="40" y="325" font-family="Arial" font-size="25" fill="#e3f4f8">Detailed table: Keep the purchased</text><text x="40" y="354" font-family="Arial" font-size="25" fill="#e3f4f8">quantity with its unit price.</text><rect x="22" y="437" width="636" height="132" rx="14" fill="#20465c"/><text x="40" y="471" font-family="Arial" font-size="25" fill="#e3f4f8">Operation: Registration, renewal and</text><text x="40" y="500" font-family="Arial" font-size="25" fill="#e3f4f8">transfer remain separate.</text><rect x="22" y="583" width="636" height="132" rx="14" fill="#20465c"/><text x="40" y="617" font-family="Arial" font-size="25" fill="#e3f4f8">Boundary: No coupon package or domain</text><text x="40" y="646" font-family="Arial" font-size="25" fill="#e3f4f8">was purchased.</text><text x="30" y="810" font-family="Arial" font-size="18" fill="white">Original document audit | Reviewed 2026-10-28</text></svg>
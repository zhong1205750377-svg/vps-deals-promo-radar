<svg xmlns="http://www.w3.org/2000/svg" width="680" height="850" viewBox="0 0 680 850"><title>Keep the route and the service together</title><rect width="680" height="850" rx="24" fill="#102b3f"/><text x="30" y="48" font-family="Arial" font-size="30" fill="white">Keep the route and the service</text><text x="30" y="88" font-family="Arial" font-size="30" fill="white">together</text><rect x="22" y="145" width="636" height="132" rx="14" fill="#20465c"/><text x="40" y="179" font-family="Arial" font-size="25" fill="#e3f4f8">New account: Use the official signup</text><text x="40" y="208" font-family="Arial" font-size="25" fill="#e3f4f8">promotion route.</text><rect x="22" y="291" width="636" height="132" rx="14" fill="#20465c"/><text x="40" y="325" font-family="Arial" font-size="25" fill="#e3f4f8">Existing account: Add credit, then open</text><text x="40" y="354" font-family="Arial" font-size="25" fill="#e3f4f8">a ticket with subject CLOUD25.</text><rect x="22" y="437" width="636" height="132" rx="14" fill="#20465c"/><text x="40" y="471" font-family="Arial" font-size="25" fill="#e3f4f8">Service: Cloud KVM and VDS; not OpenVZ</text><text x="40" y="500" font-family="Arial" font-size="25" fill="#e3f4f8">VPS.</text><rect x="22" y="583" width="636" height="132" rx="14" fill="#20465c"/><text x="40" y="617" font-family="Arial" font-size="25" fill="#e3f4f8">Timing: Matching credit within 24 hours,</text><text x="40" y="646" font-family="Arial" font-size="25" fill="#e3f4f8">per the official page.</text><text x="30" y="810" font-family="Arial" font-size="18" fill="white">Original document audit | Reviewed 2026-10-27</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 850" width="680" height="850"><title>Customer status is not renewal scope</title><rect width="680" height="850" rx="24" fill="#102b3f"/><text x="30" y="50" fill="white" font-size="31" font-family="Arial">Customer status is not renewal</text><text x="30" y="90" fill="white" font-size="31" font-family="Arial">scope</text><rect x="22" y="140" width="636" height="135" rx="14" fill="#20465c"/><text x="40" y="176" fill="#e3f4f8" font-size="27" font-family="Arial">Specific modal — WPLAUNCH mentions new</text><text x="40" y="208" fill="#e3f4f8" font-size="27" font-family="Arial">and existing customers.</text><rect x="22" y="290" width="636" height="135" rx="14" fill="#20465c"/><text x="40" y="326" fill="#e3f4f8" font-size="27" font-family="Arial">General FAQ — Describes discounts for</text><text x="40" y="358" fill="#e3f4f8" font-size="27" font-family="Arial">new purchases.</text><rect x="22" y="440" width="636" height="135" rx="14" fill="#20465c"/><text x="40" y="476" fill="#e3f4f8" font-size="27" font-family="Arial">Renewal — Do not infer an automatic</text><text x="40" y="508" fill="#e3f4f8" font-size="27" font-family="Arial">renewal discount.</text><rect x="22" y="590" width="636" height="135" rx="14" fill="#20465c"/><text x="40" y="626" fill="#e3f4f8" font-size="27" font-family="Arial">Calendar expiry — No fixed end date</text><text x="40" y="658" fill="#e3f4f8" font-size="27" font-family="Arial">verified for these two codes.</text><text x="30" y="785" fill="#c6d9e3" font-size="19" font-family="Arial">Original official-document diagram. Reviewed 2026-10-21; no</text><text x="30" y="809" fill="#c6d9e3" font-size="19" font-family="Arial">checkout test.</text></svg>
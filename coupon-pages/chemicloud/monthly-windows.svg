<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 850" width="680" height="850"><title>Two codes, two monthly windows</title><rect width="680" height="850" rx="24" fill="#102b3f"/><text x="30" y="50" fill="white" font-size="31" font-family="Arial">Two codes, two monthly windows</text><rect x="22" y="140" width="636" height="135" rx="14" fill="#20465c"/><text x="40" y="176" fill="#e3f4f8" font-size="27" font-family="Arial">WPLAUNCH — Managed WordPress, first</text><text x="40" y="208" fill="#e3f4f8" font-size="27" font-family="Arial">month for $1.</text><rect x="22" y="290" width="636" height="135" rx="14" fill="#20465c"/><text x="40" y="326" fill="#e3f4f8" font-size="27" font-family="Arial">RESELL25 — Reseller, 25% off the first</text><text x="40" y="358" fill="#e3f4f8" font-size="27" font-family="Arial">three months.</text><rect x="22" y="440" width="636" height="135" rx="14" fill="#20465c"/><text x="40" y="476" fill="#e3f4f8" font-size="27" font-family="Arial">Billing cycle — Both reviewed offers</text><text x="40" y="508" fill="#e3f4f8" font-size="27" font-family="Arial">specify monthly billing.</text><rect x="22" y="590" width="636" height="135" rx="14" fill="#20465c"/><text x="40" y="626" fill="#e3f4f8" font-size="27" font-family="Arial">After the window — These statements do</text><text x="40" y="658" fill="#e3f4f8" font-size="27" font-family="Arial">not quote later bills.</text><text x="30" y="785" fill="#c6d9e3" font-size="19" font-family="Arial">Original official-document diagram. Reviewed 2026-10-21; no</text><text x="30" y="809" fill="#c6d9e3" font-size="19" font-family="Arial">checkout test.</text></svg>
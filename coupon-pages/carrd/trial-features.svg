<svg xmlns="http://www.w3.org/2000/svg" width="680" height="850" viewBox="0 0 680 850"><title>A feature test is not a whole paid plan</title><rect width="680" height="850" rx="24" fill="#102b3f"/><text x="30" y="48" font-family="Arial" font-size="30" fill="white">A feature test is not a whole</text><text x="30" y="88" font-family="Arial" font-size="30" fill="white">paid plan</text><rect x="22" y="145" width="636" height="132" rx="14" fill="#20465c"/><text x="40" y="179" font-family="Arial" font-size="25" fill="#e3f4f8">Trial subset: Custom domains, forms and</text><text x="40" y="208" font-family="Arial" font-size="25" fill="#e3f4f8">advanced forms are listed.</text><rect x="22" y="291" width="636" height="132" rx="14" fill="#20465c"/><text x="40" y="325" font-family="Arial" font-size="25" fill="#e3f4f8">Domain prerequisite: Use custom domains</text><text x="40" y="354" font-family="Arial" font-size="25" fill="#e3f4f8">you already own.</text><rect x="22" y="437" width="636" height="132" rx="14" fill="#20465c"/><text x="40" y="471" font-family="Arial" font-size="25" fill="#e3f4f8">Paid comparison: Do not import unlimited</text><text x="40" y="500" font-family="Arial" font-size="25" fill="#e3f4f8">elements into the trial.</text><rect x="22" y="583" width="636" height="132" rx="14" fill="#20465c"/><text x="40" y="617" font-family="Arial" font-size="25" fill="#e3f4f8">Timing: No actual account-specific trial</text><text x="40" y="646" font-family="Arial" font-size="25" fill="#e3f4f8">end was observed.</text><text x="30" y="810" font-family="Arial" font-size="18" fill="white">Original document audit | Reviewed 2026-10-30</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="t d"><title id="t">Two totals for VPS prices</title><desc id="d">Documented inputs feed a service-period total and a separate cash due now total.</desc><rect width="1000" height="380" rx="24" fill="#0e1d38"/><g font-family="sans-serif" fill="white"><text x="50" y="70" font-size="34">Compare the same period. Keep cash separate.</text><rect x="50" y="110" width="400" height="210" rx="15" fill="#185e79"/><rect x="550" y="110" width="400" height="210" rx="15" fill="#0a775d"/><text x="75" y="160" font-size="27">Service-period cost</text><text x="75" y="210" font-size="22">Intro months × intro rate</text><text x="75" y="250" font-size="22">+ renewal + extras + setup</text><text x="575" y="160" font-size="27">Cash due now</text><text x="575" y="210" font-size="22">Required upfront payment</text><text x="575" y="250" font-size="22">+ setup charge</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300"><title>Keep unresolved evidence visible</title><rect width="900" height="300" rx="18" fill="#0e1d38"/><g font-family="Arial,sans-serif" fill="white"><text x="30" y="55" font-size="27">Keep unresolved evidence visible</text><text x="30" y="115" font-size="23">Missing inclusion: do not silently mark included.</text><text x="30" y="170" font-size="23">Different plan or region: scope stays unresolved.</text><text x="30" y="225" font-size="23">Customer licence route: verify eligibility separately.</text></g></svg>
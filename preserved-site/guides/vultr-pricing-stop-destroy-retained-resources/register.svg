<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300"><title>Check each inventory field separately</title><rect width="900" height="300" rx="18" fill="#0e1d38"/><g font-family="Arial,sans-serif" fill="white"><text x="30" y="55" font-size="28">Check each inventory field separately</text><text x="30" y="115" font-size="24">Instance state: running / stopped / destroyed</text><text x="30" y="170" font-size="24">Snapshot, volume, reserved IP: present / absent / unknown</text><text x="30" y="225" font-size="24">An unknown field prevents a clear audit result.</text></g></svg>
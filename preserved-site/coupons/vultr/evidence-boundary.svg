<svg xmlns="http://www.w3.org/2000/svg" width="680" height="850" viewBox="0 0 680 850"><title>Keep an offer claim with its evidence</title><rect width="680" height="850" rx="24" fill="#102b3f"/><text x="30" y="48" font-family="Arial" font-size="30" fill="white">Keep an offer claim with its</text><text x="30" y="88" font-family="Arial" font-size="30" fill="white">evidence</text><rect x="22" y="145" width="636" height="132" rx="14" fill="#20465c"/><text x="40" y="179" font-family="Arial" font-size="25" fill="#e3f4f8">Code: Use only the official string in</text><text x="40" y="208" font-family="Arial" font-size="25" fill="#e3f4f8">the article.</text><rect x="22" y="291" width="636" height="132" rx="14" fill="#20465c"/><text x="40" y="325" font-family="Arial" font-size="25" fill="#e3f4f8">Conditions: Keep product scope with that</text><text x="40" y="354" font-family="Arial" font-size="25" fill="#e3f4f8">claim.</text><rect x="22" y="437" width="636" height="132" rx="14" fill="#20465c"/><text x="40" y="471" font-family="Arial" font-size="25" fill="#e3f4f8">Review: Observation date differs from</text><text x="40" y="500" font-family="Arial" font-size="25" fill="#e3f4f8">expiry.</text><rect x="22" y="583" width="636" height="132" rx="14" fill="#20465c"/><text x="40" y="617" font-family="Arial" font-size="25" fill="#e3f4f8">Test status: Reading is not successful</text><text x="40" y="646" font-family="Arial" font-size="25" fill="#e3f4f8">redemption.</text><text x="30" y="810" font-family="Arial" font-size="18" fill="white">Original document audit | Reviewed 2026-10-24</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 850" width="680" height="850"><title>Read an offer together with its context</title><rect width="680" height="850" rx="24" fill="#102b3f"/><text x="30" y="50" fill="white" font-size="31" font-family="Arial">Read an offer together with its</text><text x="30" y="90" fill="white" font-size="31" font-family="Arial">context</text><rect x="22" y="140" width="636" height="135" rx="14" fill="#20465c"/><text x="40" y="176" fill="#e3f4f8" font-size="27" font-family="Arial">Offer — Identify the exact product</text><text x="40" y="208" fill="#e3f4f8" font-size="27" font-family="Arial">benefit.</text><rect x="22" y="290" width="636" height="135" rx="14" fill="#20465c"/><text x="40" y="326" fill="#e3f4f8" font-size="27" font-family="Arial">Conditions — Keep eligibility beside</text><text x="40" y="358" fill="#e3f4f8" font-size="27" font-family="Arial">the offer.</text><rect x="22" y="440" width="636" height="135" rx="14" fill="#20465c"/><text x="40" y="476" fill="#e3f4f8" font-size="27" font-family="Arial">Official source — Read the provider</text><text x="40" y="508" fill="#e3f4f8" font-size="27" font-family="Arial">page linked in the table.</text><rect x="22" y="590" width="636" height="135" rx="14" fill="#20465c"/><text x="40" y="626" fill="#e3f4f8" font-size="27" font-family="Arial">Review date — An observation date is</text><text x="40" y="658" fill="#e3f4f8" font-size="27" font-family="Arial">not an expiry date.</text><text x="30" y="785" fill="#c6d9e3" font-size="19" font-family="Arial">Visual guide to this existing page; not a new offer or</text><text x="30" y="809" fill="#c6d9e3" font-size="19" font-family="Arial">refreshed price claim.</text></svg>